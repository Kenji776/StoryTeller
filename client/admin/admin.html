<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>StoryTeller — Admin Console</title>
		<link rel="stylesheet" href="/style.css" />
		<link rel="stylesheet" href="/admin/admin.css" />
	</head>
	<body class="admin-body">
		<!--
			The console builds itself into #root. Everything below is what is shown
			before that happens, or when it cannot: the shell, its chrome and every
			section are constructed in client/admin/app.js.
		-->
		<div id="root" class="boot">
			<p class="boot-message">Loading console…</p>
		</div>

		<noscript>
			<div class="boot">
				<p class="boot-message">
					The admin console needs JavaScript. Nothing here works without it.
				</p>
			</div>
		</noscript>

		<script src="https://cdn.socket.io/4.7.5/socket.io.min.js" crossorigin="anonymous"></script>
		<script type="module" src="/admin/app.js"></script>
	</body>
</html>
